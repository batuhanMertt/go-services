name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Aynı branch'te yeni push gelirse önceki çalışmayı iptal et — CI dakikası boşa gitmesin.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to a supported patch release so standard-library security fixes
  # are included in every CI run.
  GO_VERSION: '1.26.8'
  NODE_VERSION: '22'
  # `./...` kullanılmıyor: admin-ui/node_modules içindeki üçüncü taraf Go
  # dosyaları taranmasın.
  GO_PKGS: ./internal/... ./services/... ./mock-tools/... ./tools/...

jobs:
  # ===========================================================================
  go-lint:
    name: Go · Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt kontrolü
        run: |
          unformatted=$(gofmt -l internal services mock-tools tools)
          if [[ -n "$unformatted" ]]; then
            echo "::error::Aşağıdaki dosyalar gofmt'lenmemiş:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet $GO_PKGS

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout 5m

  # ===========================================================================
  go-test:
    name: Go · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Testler (race detector ile)
        run: go test $GO_PKGS -race -coverprofile=coverage.out -covermode=atomic

      - name: Kapsam raporu
        run: go tool cover -func=coverage.out | tail -1

      # QUALITY GATE: kritik iş mantığı paketleri %70'in altına düşemez.
      # (Görev tanımı: "Kritik business logic için yüzde 70'in üzerinde coverage")
      - name: Kapsam eşiği — kritik paketler
        run: |
          fail=0
          for pkg in cryptox auth routing backoff breaker ratelimit schema model; do
            pct=$(go test ./internal/$pkg/... -cover 2>/dev/null \
                  | grep -oE 'coverage: [0-9.]+%' | grep -oE '[0-9.]+' || echo 0)
            printf '%-12s %s%%\n' "$pkg" "$pct"
            if (( $(echo "$pct < 70" | bc -l) )); then
              echo "::error::internal/$pkg kapsamı %70'in altında: %$pct"
              fail=1
            fi
          done
          exit $fail

      - name: Kapsam raporunu yükle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  # ===========================================================================
  go-build:
    name: Go · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Üretim ile aynı derleme koşulları: statik binary, linux/amd64.
      - name: Tüm servisleri derle
        run: |
          for svc in services/admin-api services/event-ingest services/routing-engine \
                     services/delivery-worker services/dlq-handler \
                     mock-tools/mock-publisher-1 mock-tools/mock-subscriber-1 \
                     mock-tools/webhook-sink tools/healthcheck; do
            echo "→ $svc"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags="-s -w" -o /tmp/bin/$(basename "$svc") "./$svc"
          done
          ls -lh /tmp/bin

  # ===========================================================================
  go-vuln:
    name: Go · Güvenlik açığı taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck $GO_PKGS

  # ===========================================================================
  frontend:
    name: Admin UI · Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      # `npm ci` lock dosyasına birebir uyar — sürümleri sessizce yükseltmez.
      - run: npm ci --no-audit --no-fund

      - name: TypeScript tip kontrolü
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Üretim build'i
        run: npm run build

      - name: npm audit (yalnızca bilgi)
        run: npm audit --audit-level=high || true

  # ===========================================================================
  yaml-sql-lint:
    name: Konfigürasyon · Doğrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker-compose.yml doğrulaması
        run: |
          cp .env.example .env
          # Compose dosyası sözdizimsel olarak geçerli mi ve tüm değişkenler çözülüyor mu?
          docker compose config --quiet
          echo "docker-compose.yml geçerli"

      - name: OpenAPI spec doğrulaması
        run: |
          npx -y @redocly/cli@1.25.11 lint \
            docs/api-contracts/admin-api.openapi.yaml \
            docs/api-contracts/event-ingest.openapi.yaml \
            --format stylish || true

      - name: JSON Schema dosyaları geçerli JSON mu?
        run: |
          for f in docs/api-contracts/events/*.json infra/grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || { echo "::error::Bozuk JSON: $f"; exit 1; }
            echo "✓ $f"
          done

      - name: Shell script sözdizimi
        run: |
          for f in scripts/*.sh infra/kafka/*.sh infra/postgres/init/*.sh tests/e2e/*.sh; do
            bash -n "$f" && echo "✓ $f"
          done

  # ===========================================================================
  docker-build:
    name: Docker · Build & Scan
    runs-on: ubuntu-latest
    needs: [go-build, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Go servis image'ını derle (admin-api örneği)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          build-args: CMD_PATH=services/admin-api
          tags: integration-hub/admin-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Admin UI image'ını derle
        uses: docker/build-push-action@v6
        with:
          context: ./admin-ui
          tags: integration-hub/admin-ui:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # QUALITY GATE: CRITICAL seviyesinde açık varsa build başarısız olur.
      - name: Trivy taraması (Go servisi)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: integration-hub/admin-api:ci
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy taraması (Admin UI)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: integration-hub/admin-ui:ci
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Container non-root mu?
        run: |
          user=$(docker inspect -f '{{.Config.User}}' integration-hub/admin-api:ci)
          echo "admin-api kullanıcısı: '$user'"
          if [[ -z "$user" || "$user" == "root" || "$user" == "0" ]]; then
            echo "::error::Container root olarak çalışıyor (NFR-3.3 ihlali)"
            exit 1
          fi

  # ===========================================================================
  integration:
    name: Entegrasyon · Uçtan uca
    runs-on: ubuntu-latest
    needs: [go-test, docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Araçları kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq bc

      - name: Secret üret
        run: ./scripts/gen-secrets.sh

      - name: Yığını ayağa kaldır
        run: docker compose up -d --build

      - name: Servislerin healthy olmasını bekle
        timeout-minutes: 6
        run: |
          for i in $(seq 1 60); do
            total=$(docker compose ps --format json | jq -rs 'length')
            healthy=$(docker compose ps --format json | jq -rs '[.[] | select(.Health == "healthy" or .Health == "")] | length')
            unhealthy=$(docker compose ps --format json | jq -rs '[.[] | select(.Health == "unhealthy")] | length')
            echo "[$i/60] toplam=$total healthy/nohealthcheck=$healthy unhealthy=$unhealthy"
            if [[ "$unhealthy" == "0" && "$healthy" == "$total" ]]; then
              echo "Tüm servisler hazır."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1

      - name: Uçtan uca kabul testi
        run: ./tests/e2e/e2e.sh

      - name: Hata durumunda logları göster
        if: failure()
        run: docker compose logs --tail=120

      - name: Temizlik
        if: always()
        run: docker compose down -v --remove-orphans

  # ===========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [go-lint, go-test, go-build, go-vuln, frontend, yaml-sql-lint, docker-build, integration]
    if: always()
    steps:
      - name: Tüm kontroller geçti mi?
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::Bir veya daha fazla kontrol başarısız — merge engellendi."
            exit 1
          fi
          echo "Tüm quality gate'ler geçildi."
