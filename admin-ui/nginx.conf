# =============================================================================
# Admin UI — statik dosya sunumu + Admin API vekili
#
# nginx-unprivileged image'ı kullanıldığı için 8080 portunda ve non-root
# kullanıcıyla çalışır (NFR-3.3).
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tarayıcı güvenlik başlıkları.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP: yalnızca kendi kaynaklarımız. 'unsafe-inline' style için gerekli
    # (Tailwind runtime stilleri ve recharts inline stilleri).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Sunucu sürümünü gizle.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Container healthcheck ucu.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # --- Admin API vekili ----------------------------------------------------
    # Tarayıcı ile API aynı origin'de görünür → CORS ön istekleri (preflight)
    # ve üçüncü taraf çerez kısıtları devre dışı kalır.
    location /api/ {
        proxy_pass http://admin-api:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (canlı event akışı) için tamponlama KAPALI olmalı; aksi halde
        # nginx olayları biriktirir ve akış "canlı" olmaktan çıkar.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # OpenAPI dokümantasyonuna kısayol.
    location /docs {
        proxy_pass http://admin-api:8080/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.yaml {
        proxy_pass http://admin-api:8080/openapi.yaml;
        proxy_set_header Host $host;
    }

    # --- Statik varlıklar ----------------------------------------------------
    # Vite içerik hash'li dosya adları üretir → uzun süreli önbellek güvenli.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA yönlendirmesi: bilinmeyen yollar index.html'e düşer.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
