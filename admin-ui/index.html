<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MindMons Integration & Event Hub yönetim paneli" />
    <meta name="color-scheme" content="light dark" />
    <title>Integration Hub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4cf0'/%3E%3Cpath d='M9 16h5m4 0h5M16 9v5m0 4v5' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E" />
    <script>
      // Tema, React yüklenmeden ÖNCE uygulanır: aksi halde koyu tema
      // kullanıcıda beyaz bir "flash" görünürdü (FOUC).
      (function () {
        try {
          var stored = localStorage.getItem('hub.theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          var lang = localStorage.getItem('hub.lang') || 'tr';
          document.documentElement.setAttribute('lang', lang);
        } catch (e) { /* private mode */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
