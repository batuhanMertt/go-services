# =============================================================================
# Loki 3.x — tek node, filesystem tabanlı log deposu (dev ölçeği).
# Loki logları indekslemez, yalnızca etiketleri indeksler; bu yüzden yüksek
# hacimli JSON loglarda Elasticsearch'e göre çok daha düşük maliyetlidir.
# =============================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Log retention: 7 gün. Disk şişmesin (genel kural: "disk şişmemeli").
  retention_period: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_streams_per_user: 5000
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

# Telemetriyi kapat: dev makinesinden dışarı veri gitmesin.
analytics:
  reporting_enabled: false
