# =============================================================================
# Redis 7 — Integration Hub yapılandırması
# Parola compose'daki `--requirepass ${REDIS_PASSWORD}` ile RUNTIME'da verilir;
# bu dosyada secret yoktur (docker inspect ile sızmasın diye).
# =============================================================================

# --- Ağ ----------------------------------------------------------------------
bind 0.0.0.0
protected-mode yes
tcp-keepalive 300
timeout 0

# --- Kalıcılık ---------------------------------------------------------------
# Rate limit sayaçları ve kilitler kaybolabilir (yeniden üretilirler), ancak
# rule cache'in soğuk başlangıcını yumuşatmak için AOF açık tutulur.
appendonly yes
appendfsync everysec
# RDB snapshot: 5 dakikada en az 100 değişiklik olduysa
save 300 100
dir /data

# --- Bellek ------------------------------------------------------------------
# Container memory limiti 256M; Redis'e 192M ayrılır, kalanı overhead'e bırakılır.
maxmemory 192mb
# Cache + kilit karışık kullanım: TTL'i olan anahtarlardan LRU ile at.
# `noeviction` seçilseydi cache dolduğunda rate-limit yazımları da hata verirdi.
maxmemory-policy volatile-lru

# --- Güvenlik ----------------------------------------------------------------
# Yıkıcı/gereksiz komutlar kapatılır (least privilege).
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

# --- Log ---------------------------------------------------------------------
# stdout'a yaz: Docker log driver'ı topluyor, disk şişmiyor.
logfile ""
loglevel notice

# --- Yavaş sorgu izleme -------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
