# =============================================================================
# Promtail — Docker container stdout'larını Loki'ye taşır.
# Servisler Loki'yi tanımaz; yalnızca stdout'a JSON basar (12-factor).
# JSON log satırları parse edilip `level`, `service`, `trace_id` etiketlenir,
# böylece Grafana'da trace_id ile uçtan uca arama yapılabilir.
# =============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          # Yalnızca bu projenin container'ları toplanır.
          - name: label
            values: ['com.docker.compose.project=integration-hub']

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

    pipeline_stages:
      # Go servislerimiz slog JSON basar; diğer container'lar (postgres, kafka)
      # düz metin basar — parse hatası satırı düşürmez, sadece etiketlenmez.
      - json:
          expressions:
            level: level
            msg: msg
            trace_id: trace_id
      # `level` etiketi düşük kardinaliteli (5 değer) — güvenle etiketlenebilir.
      # `trace_id` ise her event için farklıdır; ETİKET YAPILMAZ, aksi halde
      # Loki'de milyonlarca ayrı stream oluşur ve indeks patlar. Bunun yerine
      # log satırının içinde kalır ve LogQL ile aranır:
      #   {service="delivery-worker"} |= "8c1d2e3f-..."
      - labels:
          level:
